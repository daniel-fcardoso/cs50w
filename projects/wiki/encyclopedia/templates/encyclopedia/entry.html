{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <div class="wiki-content">
        {{ content|safe }}
    </div>

    <hr class="mt-4">
    <a href="{% url 'edit_page' title=title %}" class="btn btn-secondary">
        <i class="fas fa-edit"></i> Edit Page
    </a>
{% endblock %}
