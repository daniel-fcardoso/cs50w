{% extends "auctions/layout.html" %}

{% block body %}
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                CS50 <span>COMMERCE</span>
            </div>

            <h2>Create account</h2>

            {% if message %}
                <div class="auth-message">
                    {{ message }}
                </div>
            {% endif %}

            <form action="{% url 'register' %}" method="post">
                {% csrf_token %}

                <div class="auth-form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        autofocus
                        id="username"
                        type="text"
                        name="username"
                        autocomplete="username"
                    >
                </div>

                <div class="auth-form-group">
                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        autocomplete="email"
                    >
                </div>

                <div class="auth-form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                    >
                </div>

                <div class="auth-form-group">
                    <label for="confirmation">
                        Confirm password
                    </label>

                    <input
                        id="confirmation"
                        type="password"
                        name="confirmation"
                        autocomplete="new-password"
                    >
                </div>

                <button class="auth-button" type="submit">
                    Create account
                </button>
            </form>

            <p class="auth-terms">
                By creating an account, you agree to the
                CS50 COMMERCE terms and conditions.
            </p>

            <div class="auth-divider">
                <span>Already have an account?</span>
            </div>

            <a
                class="create-account-button"
                href="{% url 'login' %}"
            >
                Sign in
            </a>
        </div>
    </div>
{% endblock %}
